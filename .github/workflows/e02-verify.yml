name: E05 Format Preview
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx prettier src/features/auth/returnContext.ts src/features/auth/returnContext.test.ts --write
      - run: git diff -- src/features/auth/returnContext.ts src/features/auth/returnContext.test.ts && exit 1
