name: E02 Auth Core Verification

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npm run format:write
          git diff -- src/app/providers src/features/auth
          exit 1
