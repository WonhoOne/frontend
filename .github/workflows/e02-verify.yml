name: E06 Auth Loss Format Preview
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx prettier src/app/providers/authPrivateCacheLifecycle.test.tsx --write
      - run: git diff -- src/app/providers/authPrivateCacheLifecycle.test.tsx && exit 1
