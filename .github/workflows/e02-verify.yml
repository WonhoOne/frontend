name: E03 Format Preview

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx prettier src/pages/login/LoginPage.tsx src/pages/login/LoginPage.test.tsx --write
      - run: git diff -- src/pages/login/LoginPage.tsx src/pages/login/LoginPage.test.tsx && exit 1
