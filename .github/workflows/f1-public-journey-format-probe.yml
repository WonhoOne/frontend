name: F1 Public Journey Format Probe
on:
  pull_request:
    branches: [main]

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Print formatted public live journey
        run: |
          npx prettier --write tests/e2e/public-live-journey.spec.ts
          cat tests/e2e/public-live-journey.spec.ts
          exit 1
