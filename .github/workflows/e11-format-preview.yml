name: E11 Format Preview
on:
  pull_request:
    branches: [main]
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/providers/travelHistoryDataSource.ts src/pages/my-trips/MyTripsPage.tsx src/pages/my-trips/MyTripsPage.test.tsx
      - run: git diff -- src/app/providers/travelHistoryDataSource.ts src/pages/my-trips/MyTripsPage.tsx src/pages/my-trips/MyTripsPage.test.tsx
