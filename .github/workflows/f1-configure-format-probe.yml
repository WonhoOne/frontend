name: F1 Configure Format Probe
on:
  pull_request:
    branches: [main]

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Print formatted F1-06 files
        run: |
          npx prettier --write \
            src/features/tour-detail/tourDetail.adapter.ts \
            src/pages/configure/ConfigurePage.tsx \
            src/shared/lib/resourceIdentity.ts
          for file in \
            src/features/tour-detail/tourDetail.adapter.ts \
            src/pages/configure/ConfigurePage.tsx \
            src/shared/lib/resourceIdentity.ts; do
            echo "===== $file ====="
            cat "$file"
          done
          exit 1
