name: F1 Preview Import Format Probe
on:
  pull_request:
    branches: [main]

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Print formatted preview-import files
        run: |
          npx prettier --write \
            src/pages/tour-detail/TourDetailPage.test.tsx \
            tests/e2e/fixtures/tours-states.tsx
          echo "===== TOUR DETAIL TEST ====="
          cat src/pages/tour-detail/TourDetailPage.test.tsx
          echo "===== TOURS STATES ====="
          cat tests/e2e/fixtures/tours-states.tsx
          exit 1
