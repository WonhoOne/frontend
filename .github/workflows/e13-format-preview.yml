name: E13 Format Preview
on:
  pull_request:
    branches: [main]
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/account-history.spec.ts
      - run: git diff -- tests/e2e/account-history.spec.ts
