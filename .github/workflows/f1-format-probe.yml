name: F1 Format Probe
on:
  pull_request:
    branches: [main]

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Print formatted contract files
        run: |
          npx prettier --write src/integrations/backend/contracts
          for file in             src/integrations/backend/contracts/apiError.test.ts             src/integrations/backend/contracts/contractMappingError.ts             src/integrations/backend/contracts/decoder.ts             src/integrations/backend/contracts/tourProduct.test.ts             src/integrations/backend/contracts/tourProduct.ts             src/integrations/backend/contracts/tourSchedule.test.ts             src/integrations/backend/contracts/tourSchedule.ts; do
            echo "===== $file ====="
            cat "$file"
          done
          exit 1
