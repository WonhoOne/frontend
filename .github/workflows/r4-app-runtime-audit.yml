name: R4 App Runtime Audit

on:
  push:
    branches:
      - feat/frontend-app-runtime

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Runtime branch
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Report toolchain
        run: |
          node --version
          npm --version

      - name: Clean install
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Audit App Runtime contract boundary
        shell: bash
        run: |
          if grep -R -n -E '/api/v1/|JWT|refresh[- ]token|Authorization|localStorage[^;]*token|participantCount|coupleCount|ReservationStatus'             src/app src/pages src/mocks src/shared/motion             --include='*.ts' --include='*.tsx'             --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo "PR-02 contains a blocked Product/API/Auth contract assumption."
            exit 1
          fi

          if grep -R -n -E '\\b(TODO|FIXME|HACK)\\b'             src/app/router src/app/shell src/app/state src/mocks src/shared/motion             --include='*.ts' --include='*.tsx' --include='*.css'; then
            echo "PR-02 contains unresolved implementation markers."
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const expected = [
            'happy',
            'slow',
            'empty',
            'network-error',
            '500',
            '401',
            '409',
            '422',
            'partial-failure',
            'image-failure',
            'offline',
            'stale-refresh',
            'reservation-success',
            'ambiguous-response',
            'history-empty',
            'history-populated',
          ];

          const source = fs.readFileSync('src/mocks/scenarios.ts', 'utf8');

          for (const scenario of expected) {
            if (!source.includes(`'${scenario}'`)) {
              throw new Error(`Missing IMP-1C scenario identity: ${scenario}`);
            }
          }

          for (const leaked of [
            'honeymoon-valid',
            'honeymoon-invalid',
            'server-500',
            'unauthorized-401',
            'conflict-409',
            'validation-422',
            'reservation-ambiguous-response',
          ]) {
            if (source.includes(leaked)) {
              throw new Error(`Out-of-scope scenario identity remains: ${leaked}`);
            }
          }
          NODE

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run App Runtime E2E
        run: npm run test:e2e

      - name: Build production artifact explicitly
        run: npm run build

      - name: Audit production mock isolation
        shell: bash
        run: |
          if grep -R --include='*.js' -E 'DevScenarioSwitcher|startDevelopmentRuntime|setupWorker|mockScenario' dist/assets; then
            echo "Production assets contain development mock runtime code."
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
