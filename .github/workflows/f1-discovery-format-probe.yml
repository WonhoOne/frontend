name: F1 Discovery Format Probe
on:
  pull_request:
    branches: [main]

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Print formatted discovery query test
        run: |
          npx prettier --write src/features/tour-discovery/tourDiscovery.query.test.ts
          cat src/features/tour-discovery/tourDiscovery.query.test.ts
          exit 1
